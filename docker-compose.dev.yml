version: '3.8'

services:
  eem-omecs-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: eem-omecs-dev
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - KOBOTOOLBOX_FORM_ID=${KOBOTOOLBOX_FORM_ID}
      - KOBOTOOLBOX_TOKEN=${KOBOTOOLBOX_TOKEN}
      - KOBOTOOLBOX_BASE_URL=${KOBOTOOLBOX_BASE_URL:-https://kf.kobotoolbox.org/api/v2}
    volumes:
      # Mount source code for hot reloading
      - ./src:/app/src
      - ./public:/app/public
      - ./calculo_eem_omec.csv:/app/calculo_eem_omec.csv:ro
      - ./calculo_eem_omec_v7.csv:/app/calculo_eem_omec_v7.csv:ro
      - ./scoring_versions.json:/app/scoring_versions.json:ro
    restart: unless-stopped
    networks:
      - eem-omecs-dev-network
    command: npm run dev

networks:
  eem-omecs-dev-network:
    driver: bridge
